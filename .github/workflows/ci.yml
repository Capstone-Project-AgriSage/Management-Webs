name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `vite build`, which does not type-check, so the compiler runs on its own.
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
