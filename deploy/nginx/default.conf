# The built single-page app. /api goes to the API when API_UPSTREAM is set (40-agrisage-api-proxy.sh).

# SignalR (/api/realtime) upgrades to a WebSocket.
map $http_upgrade $agrisage_connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind the host's TLS proxy keep its scheme; otherwise the scheme of this server.
map $http_x_forwarded_proto $agrisage_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/agrisage/api-proxy.conf;

    # Vite gives every built asset a content hash: cache it for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/agent/..., /sales/...) all load index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
